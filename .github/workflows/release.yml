name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version to backfill
        required: true
        type: string
      dry_run:
        description: Verify without publishing or dispatching
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Resolve immutable release source
        id: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${REQUESTED_VERSION}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Expected a stable semantic version, got $VERSION"
            exit 1
          fi
          TAG="$VERSION"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          COMMIT="$(git rev-list -n 1 "$TAG")"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"
          git checkout --detach "$COMMIT"

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f main.js -a -f manifest.json -a -f styles.css

      - name: Verify tag matches manifest version
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::Release $VERSION does not match manifest version $MANIFEST"
            exit 1
          fi
          echo "Releasing $MANIFEST"

      - name: Verify any existing release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING="$RUNNER_TEMP/existing-release"
            mkdir -p "$EXISTING"
            gh release download "$TAG" --dir "$EXISTING" \
              --pattern main.js --pattern manifest.json --pattern styles.css
            cmp main.js "$EXISTING/main.js"
            cmp manifest.json "$EXISTING/manifest.json"
            cmp styles.css "$EXISTING/styles.css"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Obsidian downloads only these three files; the CAVI release artifact and
      # its CAVI Home dispatch are cut from cavi-ai/claude-obsidian instead.
      - name: Publish or verify GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          if [ "$RELEASE_EXISTS" = "false" ]; then
            gh release create "$TAG" main.js manifest.json styles.css \
              --title "$TAG" \
              --notes "Companion for Claude $TAG. Full notes: https://github.com/cavi-ai/claude-obsidian/blob/main/CHANGELOG.md"
          fi
